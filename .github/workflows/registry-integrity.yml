name: Registry Integrity

on:
  pull_request:
    paths:
      - "registries/**"
      - "docs/architecture/**"
      - "tests/test_registry_integrity.py"
      - "runtimes/**"
      - "lineages/**"
      - ".github/workflows/registry-integrity.yml"
  push:
    branches:
      - master
      - codex/**
    paths:
      - "registries/**"
      - "docs/architecture/**"
      - "tests/test_registry_integrity.py"
      - "runtimes/**"
      - "lineages/**"
      - ".github/workflows/registry-integrity.yml"
  workflow_dispatch:

jobs:
  registry-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Registry Integrity Tests
        run: python tests/test_registry_integrity.py
